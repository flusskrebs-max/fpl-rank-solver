[project]
name = "fplrank"
version = "0.0.1"
description = "FPL solver that maximises the probability of reaching a target rank, built on open-fpl-solver and HiGHS"
readme = "README.md"
authors = [{ name = "Alex" }]
requires-python = ">=3.14"
dependencies = [
    "highspy>=1.11.0",
    "numpy",
    "pandas",
    "scipy",
    "requests",
    "tabulate>=0.9.0",
    "matplotlib",
    # needed only because the vendored upstream parser imports them
    "fuzzywuzzy",
    "python-Levenshtein",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplrank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs a real MILP solve (deselect with -m 'not slow')",
    "network: needs internet access to raw.githubusercontent.com",
]

[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["fplrank"]
